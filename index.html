      function getProfiles() {
        return state.settings.profiles && state.settings.profiles.length ? state.settings.profiles : DEFAULT_PROFILES;
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.quotes) && parsed.settings) {
              if (!parsed.settings.profiles) parsed.settings.profiles = JSON.parse(JSON.stringify(DEFAULT_PROFILES));
              return parsed;
            }
          }
        } catch (e) { /* fallback */ }
        return defaultState();
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

      function applyTheme() {

      function formatINR(num) {
        const val = Math.round(Number(num) || 0);
        return '₹' + val.toLocaleString('en-IN');
      }

      function toFeet(val, unit) {
        const n = Number(val) || 0;
        if (unit === 'mm') return n / 304.8;
        if (unit === 'in') return n / 12;
        return n;
      }

      function toMm(val, unit) {
        const n = Number(val) || 0;
        if (unit === 'ft') return Math.round(n * 304.8);
        if (unit === 'in') return Math.round(n * 25.4);
        return Math.round(n);
      }

      function calcItemMetrics(item) {
        const wFt = Math.max(0.5, toFeet(item.width, item.unit || 'ft'));
        const hFt = Math.max(0.5, toFeet(item.height, item.unit || 'ft'));
        const qty = Math.max(1, Number(item.qty) || 1);
        const singleSqft = Math.max(0.5, wFt * hFt);
        const totalSqft = singleSqft * qty;

        const hw = state.settings.hardware;
        const profiles = getProfiles();
        const prof = profiles.find(p => p.name === item.profile) || profiles[0];
        const glassObj = GLASS_OPTIONS.find(g => g.name === item.glass) || GLASS_OPTIONS[0];
        const colorObj = COLOR_OPTIONS.find(c => c.name === item.color) || COLOR_OPTIONS[0];

        const computedRate = Number(prof.baseRate) + glassObj.rate + colorObj.surcharge + (item.mesh ? Number(hw.meshPriceSqft) : 0) + (item.grill ? Number(hw.grillPriceSqft) : 0);
        const baseRate = item.ratePerSqft ? Number(item.ratePerSqft) : computedRate;
        const lineTotal = Math.round(totalSqft * baseRate);

        const perimeterFt = 2 * (wFt + hFt) * qty;
        const shutterCount = Math.max(1, (item.panels || ['shutter']).filter(p => p === 'shutter').length) * qty;
        const isSliding = item.categoryId.includes('sliding');

        let hardwareCost = 0;
        hardwareCost += perimeterFt * (Number(hw.steelPriceFt) * 0.45);
        hardwareCost += (perimeterFt * 0.3048) * Number(hw.profileGasketMeter);
        hardwareCost += qty * 16 * Number(hw.screwsCount);

        if (isSliding) {
          hardwareCost += wFt * qty * Number(hw.aluminiumTrackFt);
          hardwareCost += shutterCount * 2 * Number(hw.groveRollerCount);
          hardwareCost += shutterCount * Number(hw.touchLockCount);
          hardwareCost += perimeterFt * Number(hw.weatherStripFt);
          if (item.mesh) {
            hardwareCost += shutterCount * 2 * Number(hw.meshRollerCount);
            hardwareCost += totalSqft * Number(hw.meshPriceSqft) * 0.55;
          }
        } else if (item.categoryId === 'ventilator') {
          hardwareCost += (wFt * 0.3048) * 5 * Number(hw.louverBladesMeter) * qty;
        } else {
          hardwareCost += shutterCount * Number(hw.espagSSCount);
          hardwareCost += shutterCount * 2 * Number(hw.frictionStay16);
          if (item.categoryId === 'casement-door') hardwareCost += qty * Number(hw.doorStopperCount);
        }
        if (item.grill) hardwareCost += totalSqft * Number(hw.grillPriceSqft) * 0.6;

        const wastageMult = 1 + (Number(hw.profileWastagePct) || 0) / 100;
        const profileCost = Math.round(totalSqft * (Number(prof.baseRate) * 0.42) * wastageMult);
        const productionCost = Math.round(hardwareCost + profileCost);
        const marginCost = Math.max(0, lineTotal - productionCost);

        return {
          wFt, hFt,
          wMm: toMm(item.width, item.unit || 'ft'),
          hMm: toMm(item.height, item.unit || 'ft'),
          qty,
          singleSqft: Number(singleSqft.toFixed(2)),
          totalSqft: Number(totalSqft.toFixed(2)),
          ratePerSqft: Math.round(baseRate),
          lineTotal,
          hardwareCost: Math.round(hardwareCost),
          profileCost,
          productionCost,
          marginCost
        };
      }

      function calcQuoteTotals(quote) {
        let subtotal = 0, totalSqft = 0, hardwareCost = 0, profileCost = 0, productionCost = 0, marginCost = 0;
        (quote.items || []).forEach(it => {
          const m = calcItemMetrics(it);
          subtotal += m.lineTotal;
          totalSqft += m.totalSqft;
          hardwareCost += m.hardwareCost;
          profileCost += m.profileCost;
          productionCost += m.productionCost;
          marginCost += m.marginCost;
        });
        const discPct = Math.max(0, Math.min(100, Number(quote.discountPct) || 0));
        const discountAmt = Math.round(subtotal * (discPct / 100));
        const taxable = Math.max(0, subtotal - discountAmt);
        const gstPct = quote.gstPct !== undefined ? Number(quote.gstPct) : 18;
        const gst = Math.round(taxable * (gstPct / 100));
        const grandTotal = taxable + gst;
        return {
          itemCount: (quote.items || []).reduce((s, i) => s + (Number(i.qty) || 1), 0),
          totalSqft: Number(totalSqft.toFixed(2)),
          subtotal,
          discPct,
          discountAmt,
          gstPct,
          gst,
          grandTotal,
          hardwareCost,
          profileCost,
          productionCost,
          marginCost
        };
      }

        el.className = `px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold transition-opacity ${cls}`;
        el.textContent = msg;
        container.appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 250); }, 2600);

          list.innerHTML = '<div class="text-xs text-stone-400 text-center py-8">No quotations yet.</div>';

                <span>${t.itemCount} items • ${t.totalSqft} sqft</span>
                <span class="font-mono-num font-bold text-stone-900 dark:text-white">${formatINR(t.grandTotal)}</span>
              </div>
            </div>
          `;
        }).join('');
        list.querySelectorAll('[data-open-quote]').forEach(el => {
          el.addEventListener('click', () => {
            activeQuoteId = el.getAttribute('data-open-quote');
            toggleQuickDrawer(false);
            navigate('quote-detail');
          });
        });

      function buildDiagramSVG(item, size = 'lg') {
        const wFt = Math.max(1, toFeet(item.width, item.unit || 'ft'));
        const hFt = Math.max(1, toFeet(item.height, item.unit || 'ft'));
        const wMm = toMm(item.width, item.unit || 'ft');
        const hMm = toMm(item.height, item.unit || 'ft');

        const maxW = size === 'sm' ? 105 : 270;
        const maxH = size === 'sm' ? 90 : 220;
        const ratio = Math.min(maxW / wFt, maxH / hFt);
        const drawW = Math.max(58, Math.round(wFt * ratio));
        const drawH = Math.max(52, Math.round(hFt * ratio));

        const padL = size === 'sm' ? 10 : 42;
        const padT = size === 'sm' ? 8 : 24;
        const padR = size === 'sm' ? 10 : 24;
        const padB = size === 'sm' ? 12 : 38;
        const svgW = drawW + padL + padR;
        const svgH = drawH + padT + padB;

        const colorObj = COLOR_OPTIONS.find(c => c.name === item.color) || COLOR_OPTIONS[0];
        const frameFill = colorObj.hex;
        const frameStroke = colorObj.border;
        const frameThick = size === 'sm' ? 5 : 9;

        const panels = item.panels && item.panels.length ? item.panels : ['shutter'];
        let inner = `<rect x="${padL}" y="${padT}" width="${drawW}" height="${drawH}" fill="${frameFill}" stroke="${frameStroke}" stroke-width="2" rx="2"/>`;
        const innerX = padL + frameThick;
        const innerW = drawW - frameThick * 2;
        const innerTopY = padT + frameThick;
        const innerTotalH = drawH - frameThick * 2;

        inner += `<rect x="${innerX}" y="${innerTopY}" width="${innerW}" height="${innerTotalH}" fill="#ecfeff" stroke="${frameStroke}" stroke-width="1"/>`;

        const adjTopH = item.topFixed ? Math.round(innerTotalH * 0.24) : 0;
        const adjBotH = item.bottomFixed ? Math.round(innerTotalH * 0.24) : 0;
        const adjMidY = innerTopY + adjTopH;
        const adjMidH = Math.max(20, innerTotalH - adjTopH - adjBotH);

        if (item.topFixed) {
          inner += `<rect x="${innerX}" y="${innerTopY}" width="${innerW}" height="${adjTopH}" fill="#cffafe" stroke="${frameStroke}" stroke-width="1.5"/>`;
          inner += `<text x="${innerX + innerW / 2}" y="${innerTopY + adjTopH / 2 + 3}" text-anchor="middle" font-size="${size === 'sm' ? 7 : 10}" fill="#0f766e" font-weight="600">FIX</text>`;
        }
        if (item.bottomFixed) {
          const by = adjMidY + adjMidH;
          inner += `<rect x="${innerX}" y="${by}" width="${innerW}" height="${adjBotH}" fill="#cffafe" stroke="${frameStroke}" stroke-width="1.5"/>`;
          inner += `<text x="${innerX + innerW / 2}" y="${by + adjBotH / 2 + 3}" text-anchor="middle" font-size="${size === 'sm' ? 7 : 10}" fill="#0f766e" font-weight="600">FIX</text>`;
        }

        const pW = innerW / panels.length;
        const isSliding = item.categoryId.includes('sliding');

        panels.forEach((pType, idx) => {
          const px = innerX + idx * pW;
          const py = adjMidY;
          inner += `<rect x="${px}" y="${py}" width="${pW}" height="${adjMidH}" fill="${pType === 'fixed' ? '#cffafe' : '#ecfeff'}" stroke="${frameStroke}" stroke-width="1.5"/>`;

          if (item.grill) {
            const bars = Math.max(2, Math.floor(pW / 22));
            for (let b = 1; b < bars; b++) {
              const bx = px + (pW / bars) * b;
              inner += `<line x1="${bx}" y1="${py}" x2="${bx}" y2="${py + adjMidH}" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>`;
            }
          }
          if (item.mesh && pType !== 'fixed') {
            inner += `<rect x="${px + 3}" y="${py + 3}" width="${pW - 6}" height="${adjMidH - 6}" fill="none" stroke="#0d9488" stroke-width="1" stroke-dasharray="2,2"/>`;
          }

          if (pType === 'louver' || item.categoryId === 'ventilator') {
            for (let s = 1; s < 6; s++) {
              const sy = py + (adjMidH / 6) * s;
              inner += `<line x1="${px + 4}" y1="${sy}" x2="${px + pW - 4}" y2="${sy - 3}" stroke="#334155" stroke-width="1.5"/>`;
            }
          } else if (pType === 'fixed' || item.categoryId === 'fixed-window') {
            inner += `<text x="${px + pW / 2}" y="${py + adjMidH / 2 + 3}" text-anchor="middle" font-size="${size === 'sm' ? 7 : 10}" fill="#0f766e" font-weight="600">FIX</text>`;
          } else if (isSliding) {
            const cy = py + adjMidH / 2;
            const dir = idx % 2 === 0 ? 1 : -1;
            const ax1 = px + pW / 2 - 12 * dir;
            const ax2 = px + pW / 2 + 12 * dir;
            inner += `<line x1="${ax1}" y1="${cy}" x2="${ax2}" y2="${cy}" stroke="#0f766e" stroke-width="2"/>`;
            inner += `<polyline points="${ax2 - 5 * dir},${cy - 4} ${ax2},${cy} ${ax2 - 5 * dir},${cy + 4}" fill="none" stroke="#0f766e" stroke-width="2"/>`;
          } else if (item.categoryId === 'top-hung') {
            inner += `<polyline points="${px + 3},${py + adjMidH - 3} ${px + pW / 2},${py + 4} ${px + pW - 3},${py + adjMidH - 3}" fill="none" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="4,3"/>`;
          } else {
            const hingeLeft = idx % 2 === 0;
            const hx = hingeLeft ? px + 3 : px + pW - 3;
            const ox = hingeLeft ? px + pW - 3 : px + 3;
            inner += `<polyline points="${hx},${py + 3} ${ox},${py + adjMidH / 2} ${hx},${py + adjMidH - 3}" fill="none" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="4,3"/>`;
            inner += `<rect x="${ox - 2}" y="${py + adjMidH / 2 - 5}" width="4" height="10" rx="1" fill="#334155"/>`;
          }
        });

        if (size === 'lg') {
          const dimY = padT + drawH + 16;
          inner += `<line x1="${padL}" y1="${dimY}" x2="${padL + drawW}" y2="${dimY}" stroke="#64748b" stroke-width="1.2"/>`;
          inner += `<line x1="${padL}" y1="${dimY - 4}" x2="${padL}" y2="${dimY + 4}" stroke="#64748b" stroke-width="1.2"/>`;
          inner += `<line x1="${padL + drawW}" y1="${dimY - 4}" x2="${padL + drawW}" y2="${dimY + 4}" stroke="#64748b" stroke-width="1.2"/>`;
          inner += `<text x="${padL + drawW / 2}" y="${dimY + 14}" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">${wFt.toFixed(2)} ft (${wMm} mm)</text>`;

          const dimX = padL - 14;
          inner += `<line x1="${dimX}" y1="${padT}" x2="${dimX}" y2="${padT + drawH}" stroke="#64748b" stroke-width="1.2"/>`;
          inner += `<line x1="${dimX - 4}" y1="${padT}" x2="${dimX + 4}" y2="${padT}" stroke="#64748b" stroke-width="1.2"/>`;
          inner += `<line x1="${dimX - 4}" y1="${padT + drawH}" x2="${dimX + 4}" y2="${padT + drawH}" stroke="#64748b" stroke-width="1.2"/>`;
          inner += `<text x="${dimX - 6}" y="${padT + drawH / 2}" text-anchor="middle" font-size="11" fill="#475569" font-weight="600" transform="rotate(-90 ${dimX - 6} ${padT + drawH / 2})">${hFt.toFixed(2)} ft (${hMm} mm)</text>`;
        }

        return `<svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}" class="max-w-full h-auto mx-auto select-none">${inner}</svg>`;
      }

      function navigate(route) {
        currentRoute = route;
        document.querySelectorAll('.nav-item').forEach(btn => {
          const target = btn.getAttribute('data-nav');
          const active = target === route || ((route === 'quote-detail' || route === 'product-select' || route === 'configurator') && target === 'quotes');
          btn.classList.toggle('bg-teal-50', active);
          btn.classList.toggle('text-teal-800', active);
          btn.classList.toggle('dark:bg-teal-950/60', active);
          btn.classList.toggle('dark:text-teal-300', active);
          btn.classList.toggle('text-stone-600', !active);
          btn.classList.toggle('dark:text-slate-300', !active);
          btn.classList.toggle('hover:bg-stone-100', !active);
          btn.classList.toggle('dark:hover:bg-slate-800', !active);
        });

        const meta = {
          'dashboard': ['Dashboard', 'MakeIt Digital demo — quotations, clients, and production metrics'],
          'create-quotation': ['New Quotation', 'Create a client quote and assign a site engineer'],
          'quotes': ['View Quotes', 'Search, filter, edit, and manage all UPVC quotations'],
          'quote-detail': ['Quote Details', 'Edit quote details, configure items, and export Quote, Cutting Schedule, or Invoice'],
          'product-select': ['Select UPVC Product', 'Choose a window, door, or ventilator category'],
          'configurator': ['Product Configurator', 'Live 2D dimensions, panels, profile, rate, and hardware costing'],
          'clients': ['Clients Directory', 'Add, edit, search, and manage customer records'],
          'employees': ['Employees & Engineers', 'Add, edit, and manage site engineers'],
          'reports': ['Reports & Analytics', 'Monthly, Item, Client, Hardware, and Quotation reports'],
          'settings': ['Settings & Pricing', 'Edit company profile, banking, terms, profile rates, and hardware pricing'],
          'account': ['My Account', 'Edit your admin profile details']
        };
        const [t, sub] = meta[route] || ['Dashboard', ''];
        document.getElementById('page-title').textContent = t;
        document.getElementById('page-subtitle').textContent = sub;

        document.getElementById('sidebar').classList.add('-translate-x-full');
        document.getElementById('sidebar-backdrop').classList.add('hidden');
        document.getElementById('user-dropdown').classList.add('hidden');

        renderMain();
      }

      function renderMain() {
        const container = document.getElementById('main-view');
        if (chartInstance) { chartInstance.destroy(); chartInstance = null; }

        if (currentRoute === 'dashboard') renderDashboard(container);
        else if (currentRoute === 'create-quotation') renderCreateQuotation(container);
        else if (currentRoute === 'quotes') renderQuotesList(container);
        else if (currentRoute === 'quote-detail') renderQuoteDetail(container);
        else if (currentRoute === 'product-select') renderProductSelect(container);
        else if (currentRoute === 'configurator') renderConfigurator(container);
        else if (currentRoute === 'clients') renderClients(container);
        else if (currentRoute === 'employees') renderEmployees(container);
        else if (currentRoute === 'reports') renderReports(container);
        else if (currentRoute === 'settings') renderSettings(container);
        else if (currentRoute === 'account') renderAccount(container);
      }

            return true;
          });

          const totalPages = Math.max(1, Math.ceil(filtered.length / perPage));

            <span>Showing ${slice.length} of ${filtered.length} quotes</span>
            <div class="flex gap-1.5">
              <button id="qp-prev" class="px-2.5 py-1 rounded-lg border border-stone-300 dark:border-slate-700 ${quotesPage <= 1 ? 'opacity-40' : ''}">Prev</button>

              <button id="qp-next" class="px-2.5 py-1 rounded-lg border border-stone-300 dark:border-slate-700 ${quotesPage >= totalPages ? 'opacity-40' : ''}">Next</button>
            </div>
          `;
          document.getElementById('qp-prev').addEventListener('click', () => { if (quotesPage > 1) { quotesPage--; drawRows(); } });
          document.getElementById('qp-next').addEventListener('click', () => { if (quotesPage < totalPages) { quotesPage++; drawRows(); } });

          tbody.querySelectorAll('[data-q-view]').forEach(btn => {
            btn.addEventListener('click', () => { activeQuoteId = btn.getAttribute('data-q-view'); navigate('quote-detail'); });
          });

          tbody.querySelectorAll('[data-q-del]').forEach(btn => {
            btn.addEventListener('click', () => {
              const id = btn.getAttribute('data-q-del');
              openModal('Delete Quotation', `<p class="text-sm">Delete quotation <strong>${id}</strong>? This cannot be undone.</p>`, `
                <button id="m-cancel" class="px-4 py-2 rounded-xl border border-stone-300 dark:border-slate-700 text-xs font-semibold">Cancel</button>
                <button id="m-confirm" class="px-4 py-2 rounded-xl bg-rose-600 text-white text-xs font-semibold">Delete</button>
              `);
              document.getElementById('m-cancel').addEventListener('click', closeModal);
              document.getElementById('m-confirm').addEventListener('click', () => {
                state.quotes = state.quotes.filter(x => x.id !== id);
                if (activeQuoteId === id) activeQuoteId = state.quotes[0] ? state.quotes[0].id : null;
                saveState();
                closeModal();
                showToast(`Deleted ${id}`, 'info');
                drawRows();
              });
            });
          });
        }

        ['fq-date', 'fq-id', 'fq-client', 'fq-loc'].forEach(id => {
          document.getElementById(id).addEventListener('input', () => { quotesPage = 1; drawRows(); });
        });
        document.getElementById('fq-reset').addEventListener('click', () => {
          ['fq-date', 'fq-id', 'fq-client', 'fq-loc'].forEach(id => { document.getElementById(id).value = ''; });
          quotesPage = 1;
          drawRows();
        });
        drawRows();

                    const sashW = Math.max(120, Math.round((m.wMm - 88) / pCount));
                    const sashH = Math.max(120, Math.round(m.hMm - 88));
                    const steelW = Math.max(100, sashW - 40);
                    const steelH = Math.max(100, sashH - 40);
                    const glassW = Math.max(80, sashW - 76);
                    const glassH = Math.max(80, sashH - 76);
                    return `
                      <tr>
                        <td class="border border-stone-300 p-2">
                          <div class="font-bold">${it.label || it.categoryName}</div>
                          <div class="text-[11px] text-stone-500">${it.profile} • ${it.series} (${m.wMm}×${m.hMm}mm)</div>
                        </td>
                        <td class="border border-stone-300 p-2 text-right font-bold">${m.qty}</td>
                        <td class="border border-stone-300 p-2">2× ${m.wMm}mm (H)<br/>2× ${m.hMm}mm (V)</td>
                        <td class="border border-stone-300 p-2">${pCount * 2}× ${sashW}mm (H)<br/>${pCount * 2}× ${sashH}mm (V)</td>
                        <td class="border border-stone-300 p-2">${pCount * 2}× ${steelW}mm<br/>${pCount * 2}× ${steelH}mm</td>
                        <td class="border border-stone-300 p-2 font-semibold">${pCount}× (${glassW} × ${glassH} mm)</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          `;
        }

        openModal(title, html, `
          <button id="m-doc-close" class="px-4 py-2 rounded-xl border border-stone-300 dark:border-slate-700 text-xs font-semibold">Close</button>
          <button id="m-doc-print" class="px-4 py-2 rounded-xl bg-teal-700 text-white text-xs font-semibold">Print / Save PDF</button>
        `);

        document.getElementById('m-doc-close').addEventListener('click', closeModal);
        document.getElementById('m-doc-print').addEventListener('click', () => {
          const printEl = document.getElementById('print-area');
          printEl.innerHTML = html;
          printEl.classList.remove('hidden');
          window.print();
          printEl.classList.add('hidden');
        });
      }

              const idx = quote.items.findIndex(x => x.id === d.id);
              if (idx >= 0) quote.items[idx] = d;
              showToast('Item updated');

            saveState();
            navigate('quote-detail');
          });

      function renderReports(el) {
        const tabs = [
          { id: 'monthly', label: 'Monthly Report' },
          { id: 'item', label: 'Item Report' },
          { id: 'client', label: 'Client Report' },
          { id: 'hardware', label: 'Hardware Report' },
          { id: 'quotation', label: 'Quotation Report' }
        ];

        el.innerHTML = `
          <div class="flex flex-wrap gap-2">
            ${tabs.map(tb => `<button data-rtab="${tb.id}" class="px-3.5 py-2 rounded-xl text-xs font-semibold transition ${activeReportTab === tb.id ? 'bg-teal-700 text-white shadow-sm' : 'bg-white dark:bg-slate-900 border border-stone-200 dark:border-slate-800 text-stone-600 dark:text-slate-300'}">${tb.label}</button>`).join('')}
          </div>

          <div class="bg-white dark:bg-slate-900 rounded-2xl border border-stone-200 dark:border-slate-800 p-4 flex flex-wrap items-center justify-between gap-3 shadow-sm">
            <div class="flex flex-wrap items-center gap-2">
              <input id="rep-start" type="date" class="px-3 py-1.5 rounded-xl border border-stone-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs" />
              <span class="text-xs text-stone-400">to</span>
              <input id="rep-end" type="date" class="px-3 py-1.5 rounded-xl border border-stone-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs" />
              <input id="rep-search" type="text" placeholder="Search Quote ID, Client, or Item..." class="px-3 py-1.5 rounded-xl border border-stone-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs w-56" />
            </div>
            <button id="rep-export-csv" class="px-4 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-semibold">Download CSV</button>
          </div>

          <div class="bg-white dark:bg-slate-900 rounded-2xl border border-stone-200 dark:border-slate-800 overflow-hidden shadow-sm">
            <div id="rep-table-wrap" class="overflow-x-auto"></div>
          </div>
        `;

        el.querySelectorAll('[data-rtab]').forEach(b => {
          b.addEventListener('click', () => { activeReportTab = b.getAttribute('data-rtab'); renderReports(el); });
        });

        let lastCsvRows = [];

        function drawReport() {
          const sDate = document.getElementById('rep-start').value;
          const eDate = document.getElementById('rep-end').value;
          const qStr = document.getElementById('rep-search').value.trim().toLowerCase();

          const filtered = state.quotes.filter(q => {
            if (sDate && q.date < sDate) return false;
            if (eDate && q.date > eDate) return false;
            if (qStr) {
              const hit = q.id.toLowerCase().includes(qStr) || q.clientName.toLowerCase().includes(qStr) || q.clientPhone.toLowerCase().includes(qStr) || q.items.some(i => i.categoryName.toLowerCase().includes(qStr));
              if (!hit) return false;
            }
            return true;
          });

          const wrap = document.getElementById('rep-table-wrap');
          let headers = [], rows = [], sumRow = [];

          if (activeReportTab === 'monthly' || activeReportTab === 'quotation') {
            headers = ['DATE', 'QUOTE ID', 'ITEMS', 'TOTAL', 'GST', 'SQFT', 'GRAND TOTAL'];
            let tot = 0, gst = 0, sqft = 0, gtot = 0, cnt = 0;
            rows = filtered.map(q => {
              const t = calcQuoteTotals(q);
              tot += t.subtotal; gst += t.gst; sqft += t.totalSqft; gtot += t.grandTotal; cnt += t.itemCount;
              return [q.date, q.id, t.itemCount, formatINR(t.subtotal), formatINR(t.gst), t.totalSqft.toFixed(2), formatINR(t.grandTotal)];
            });
            sumRow = ['Total', '', cnt, formatINR(tot), formatINR(gst), sqft.toFixed(2), formatINR(gtot)];
          } else if (activeReportTab === 'item') {
            headers = ['DATE', 'QUOTE ID', 'CLIENT NAME', 'CLIENT PHONE', 'ITEMS', 'SQFT', 'GRAND TOTAL'];
            let sqft = 0, gtot = 0, cnt = 0;
            rows = filtered.map(q => {
              const t = calcQuoteTotals(q);
              sqft += t.totalSqft; gtot += t.grandTotal; cnt += t.itemCount;
              return [q.date, q.id, q.clientName, q.clientPhone, q.items.map(i => i.categoryName).join(', ') || '—', t.totalSqft.toFixed(2), formatINR(t.grandTotal)];
            });
            sumRow = ['Total', '', '', '', cnt, sqft.toFixed(2), formatINR(gtot)];
          } else if (activeReportTab === 'client') {
            headers = ['S.NO', 'QUOTE COUNT', 'CLIENT NAME', 'CLIENT PHONE', 'TOTAL VALUE'];
            rows = state.clients.filter(c => !qStr || c.name.toLowerCase().includes(qStr) || c.phone.includes(qStr)).map((c, idx) => {
              const cQuotes = filtered.filter(q => q.clientName.toLowerCase() === c.name.toLowerCase());
              const val = cQuotes.reduce((s, q) => s + calcQuoteTotals(q).grandTotal, 0);
              return [idx + 1, cQuotes.length, c.name, c.phone, formatINR(val)];
            });
          } else if (activeReportTab === 'hardware') {
            headers = ['DATE', 'QUOTE ID', 'ITEMS', 'SQFT', 'HARDWARE COST', 'PROFILE COST', 'MARGIN COST', 'PRODUCTION COST'];
            let hw = 0, pr = 0, mg = 0, pd = 0, sqft = 0;
            rows = filtered.map(q => {
              const t = calcQuoteTotals(q);
              hw += t.hardwareCost; pr += t.profileCost; mg += t.marginCost; pd += t.productionCost; sqft += t.totalSqft;
              return [q.date, q.id, t.itemCount, t.totalSqft.toFixed(2), formatINR(t.hardwareCost), formatINR(t.profileCost), formatINR(t.marginCost), formatINR(t.productionCost)];
            });
            sumRow = ['Total', '', '', sqft.toFixed(2), formatINR(hw), formatINR(pr), formatINR(mg), formatINR(pd)];
          }

          lastCsvRows = [headers, ...rows];
          wrap.innerHTML = `
            <table class="w-full text-left text-xs">
              <thead class="bg-stone-50 dark:bg-slate-800/60 text-stone-500 uppercase text-[10px] tracking-wider">
                <tr>${headers.map(h => `<th class="px-4 py-3">${h}</th>`).join('')}</tr>
              </thead>
              <tbody class="divide-y divide-stone-200 dark:divide-slate-800">
                ${rows.map(r => `<tr class="hover:bg-stone-50 dark:hover:bg-slate-800/40">${r.map(c => `<td class="px-4 py-3 whitespace-nowrap">${c}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${headers.length}" class="px-4 py-8 text-center text-stone-400">No records found.</td></tr>`}
              </tbody>
              ${sumRow.length ? `<tfoot class="bg-stone-100 dark:bg-slate-800 font-bold"><tr>${sumRow.map(c => `<td class="px-4 py-3">${c}</td>`).join('')}</tr></tfoot>` : ''}
            </table>
          `;
        }

        ['rep-start', 'rep-end', 'rep-search'].forEach(id => document.getElementById(id).addEventListener('input', drawReport));
        document.getElementById('rep-export-csv').addEventListener('click', () => {
          const csv = lastCsvRows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
          const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `makeit-digital-${activeReportTab}-report.csv`;
          a.click();
          URL.revokeObjectURL(url);
          showToast('CSV downloaded');
        });
        drawReport();
      }

              <div class="flex items-center justify-between">
                <h4 class="font-bold text-sm">Hardware & Pricing Configuration</h4>
                <span class="text-xs text-stone-400">26 configurable rates</span>
              </div>
              <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 text-xs">
                ${hwFields.map(([key, label]) => `
                  <div>
                    <label class="block text-[11px] font-semibold text-stone-500 mb-1">${label}</label>
                    <input data-hw="${key}" type="number" step="0.5" value="${hw[key]}" class="w-full px-3 py-2 rounded-xl border border-stone-300 dark:border-slate-700 bg-white dark:bg-slate-800 font-mono-num font-semibold" />
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="flex justify-end">
              <button type="submit" class="px-6 py-2.5 rounded-xl bg-teal-700 hover:bg-teal-800 text-white text-xs font-bold shadow-sm">Save All Settings</button>
            </div>
          </form>
        `;

        document.getElementById('settings-form').addEventListener('submit', (e) => {
          e.preventDefault();
          s.companyName = document.getElementById('st-cname').value.trim();
          s.gstin = document.getElementById('st-gstin').value.trim();
          s.location = document.getElementById('st-loc').value.trim();
          s.contact = document.getElementById('st-contact').value.trim();
          s.address = document.getElementById('st-addr').value.trim();
          s.bankName = document.getElementById('st-bank').value.trim();
          s.branch = document.getElementById('st-branch').value.trim();
          s.accountType = document.getElementById('st-actype').value.trim();
          s.accountNumber = document.getElementById('st-acno').value.trim();
          s.ifsc = document.getElementById('st-ifsc').value.trim();
          s.terms = document.getElementById('st-terms').value;
          el.querySelectorAll('[data-prof-rate]').forEach(inp => {
            const idx = Number(inp.getAttribute('data-prof-rate'));
            if (profiles[idx]) profiles[idx].baseRate = Number(inp.value) || profiles[idx].baseRate;
          });
          el.querySelectorAll('[data-hw]').forEach(inp => {
            hw[inp.getAttribute('data-hw')] = Number(inp.value) || 0;
          });
          saveState();
          showToast('All settings & rates saved');
        });
      }

      function renderAccount(el) {
        const a = state.account;
        el.innerHTML = `
          <div class="max-w-2xl mx-auto bg-white dark:bg-slate-900 rounded-2xl border border-stone-200 dark:border-slate-800 p-6 space-y-5 shadow-sm">
            <div class="flex items-center gap-4 border-b border-stone-200 dark:border-slate-800 pb-4">
              <div class="w-14 h-14 rounded-2xl bg-teal-700 text-white flex items-center justify-center font-bold text-xl">
                ${a.name.split(' ').map(x => x[0]).join('').slice(0, 2).toUpperCase()}
              </div>
              <div>
                <h3 class="font-bold text-base">${a.name}</h3>
                <p class="text-xs text-stone-500">${a.email} • Role: ${state.auth.role}</p>
              </div>
            </div>
            <form id="account-form" class="space-y-4 text-xs">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div><label class="block font-semibold mb-1">Full Name</label><input id="ac-name" type="text" value="${a.name}" class="w-full px-3 py-2 rounded-xl border border-stone-300 dark:border-slate-700 bg-white dark:bg-slate-800" /></div>
                <div><label class="block font-semibold mb-1">Email</label><input id="ac-email" type="email" value="${a.email}" class="w-full px-3 py-2 rounded-xl border border-stone-300 dark:border-slate-700 bg-white dark:bg-slate-800" /></div>
                <div><label class="block font-semibold mb-1">Phone</label><input id="ac-phone" type="text" value="${a.phone}" class="w-full px-3 py-2 rounded-xl border border-stone-300 dark:border-slate-700 bg-white dark:bg-slate-800" /></div>
                <div><label class="block font-semibold mb-1">Location</label><input id="ac-loc" type="text" value="${a.location}" class="w-full px-3 py-2 rounded-xl border border-stone-300 dark:border-slate-700 bg-white dark:bg-slate-800" /></div>
                <div class="sm:col-span-2"><label class="block font-semibold mb-1">Address</label><input id="ac-addr" type="text" value="${a.address}" class="w-full px-3 py-2 rounded-xl border border-stone-300 dark:border-slate-700 bg-white dark:bg-slate-800" /></div>
              </div>
              <div class="flex justify-end">
                <button type="submit" class="px-5 py-2 rounded-xl bg-teal-700 hover:bg-teal-800 text-white font-bold">Update Profile</button>
              </div>
            </form>
          </div>
        `;
        document.getElementById('account-form').addEventListener('submit', (e) => {
          e.preventDefault();
          a.name = document.getElementById('ac-name').value.trim() || a.name;
          a.email = document.getElementById('ac-email').value.trim() || a.email;
          a.phone = document.getElementById('ac-phone').value.trim();
          a.location = document.getElementById('ac-loc').value.trim();
          a.address = document.getElementById('ac-addr').value.trim();
          document.getElementById('sidebar-user-name').textContent = a.name;
          saveState();
          showToast('Profile updated');
          renderAccount(el);
        });
      }

      function initEvents() {
        document.querySelectorAll('[data-nav]').forEach(btn => {
          btn.addEventListener('click', () => {
            const target = btn.getAttribute('data-nav');
            const action = btn.getAttribute('data-action');
            navigate(target);
            if (action === 'open-add-employee') openEmployeeModal(null, () => renderMain());
          });
        });

        document.getElementById('top-new-quote').addEventListener('click', () => navigate('create-quotation'));
        document.getElementById('btn-open-sidebar').addEventListener('click', () => {
          document.getElementById('sidebar').classList.remove('-translate-x-full');
          document.getElementById('sidebar-backdrop').classList.remove('hidden');
        });
        document.getElementById('btn-close-sidebar').addEventListener('click', () => {
          document.getElementById('sidebar').classList.add('-translate-x-full');
          document.getElementById('sidebar-backdrop').classList.add('hidden');
        });
        document.getElementById('sidebar-backdrop').addEventListener('click', () => {
          document.getElementById('sidebar').classList.add('-translate-x-full');
          document.getElementById('sidebar-backdrop').classList.add('hidden');
        });
        document.getElementById('btn-user-menu').addEventListener('click', () => {
          document.getElementById('user-dropdown').classList.toggle('hidden');
        });
        document.getElementById('btn-theme-toggle').addEventListener('click', () => {
          state.theme = state.theme === 'dark' ? 'light' : 'dark';
          applyTheme();
          saveState();
        });
        document.getElementById('btn-quick-drawer').addEventListener('click', () => toggleQuickDrawer(true));
        document.getElementById('btn-close-drawer').addEventListener('click', () => toggleQuickDrawer(false));
        document.getElementById('quick-drawer-backdrop').addEventListener('click', () => toggleQuickDrawer(false));
        document.getElementById('btn-drawer-add').addEventListener('click', () => { toggleQuickDrawer(false); navigate('create-quotation'); });
        document.getElementById('btn-close-modal').addEventListener('click', closeModal);
        document.getElementById('modal-backdrop').addEventListener('click', (e) => { if (e.target.id === 'modal-backdrop') closeModal(); });

        document.getElementById('btn-logout').addEventListener('click', () => {
          state.auth.loggedIn = false;
          saveState();
          document.getElementById('app-shell').classList.add('hidden');
          document.getElementById('login-screen').classList.remove('hidden');
        });
        document.getElementById('btn-demo-fill').addEventListener('click', () => {
          document.getElementById('login-email').value = 'demo@makeitdigital.in';
          document.getElementById('login-password').value = 'demo1234';
          showToast('Demo credentials filled', 'info');
        });
        document.getElementById('login-form').addEventListener('submit', (e) => {
          e.preventDefault();
          state.auth.loggedIn = true;
          state.auth.email = document.getElementById('login-email').value.trim();
          saveState();
          document.getElementById('login-screen').classList.add('hidden');
          document.getElementById('app-shell').classList.remove('hidden');
          navigate('dashboard');
          showToast('Welcome to MakeIt Digital demo!');
        });
        document.getElementById('btn-reset-demo').addEventListener('click', () => {
          state = defaultState();
          activeQuoteId = state.quotes[0].id;
          saveState();
          applyTheme();
          navigate('dashboard');
          showToast('Demo data restored', 'info');
        });
      }

      applyTheme();
      initEvents();
      document.getElementById('sidebar-user-name').textContent = state.account.name;
      if (!state.auth.loggedIn) {
        document.getElementById('app-shell').classList.add('hidden');
        document.getElementById('login-screen').classList.remove('hidden');
      } else {
        navigate('dashboard');
      }
    })();
  </script>
</body>
</html>
